name: Build Siebla
on:
  workflow_dispatch:
    inputs:
      ui:
        description: "Select frontend"
        required: true
        default: native
        type: choice
        options:
          - native
          - winforms
          - browser
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build selected frontend
        shell: pwsh
        run: python build_windows.py --ui ${{ inputs.ui }}
      - name: Smoke test embedded Python
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "dist/Siebla-${{ inputs.ui }}"
          & "$dir/python.exe" -c "import sys, openpyxl, et_xmlfile; assert sys.version_info[:2] == (3, 12); print(sys.executable, openpyxl.__version__)"
          & "$dir/python.exe" -c "import engine; print(engine.run_cell('2+3'))"
          if (!(Test-Path "$dir/Siebla.exe")) { throw "Missing launcher" }
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Siebla-${{ inputs.ui }}-Windows-x64
          path: dist/Siebla-${{ inputs.ui }}.zip
          if-no-files-found: error
          retention-days: 30
